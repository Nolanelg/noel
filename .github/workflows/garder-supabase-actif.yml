# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Cette tâche appelle la base tous les 3 jours pour la garder éveillée.
# Elle ne fait qu'une lecture (une carte qui n'existe pas) : rien n'est
# ajouté aux statistiques. On peut aussi la lancer à la main depuis
# l'onglet « Actions » du dépôt.
name: Garder Supabase actif

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la base de données
        env:
          # Adresse et clé publique du projet (les mêmes que dans config.js)
          SUPABASE_URL: https://lwmdooxsaqhhinvpxjqb.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bWRvb3hzYXFoaGludnB4anFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTM3MjIsImV4cCI6MjExMDYyOTcyMn0.g_VtMLjF_FSwzqyrBjTp42SRDsJP_y9e1nO3vw4qj7s
        run: |
          for essai in 1 2 3; do
            if curl -fsS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/get_card" \
                 -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
                 -H "Content-Type: application/json" -d '{"p_id":"garder-actif"}'; then
              echo; echo "Base Supabase active ✓"; exit 0
            fi
            echo "Essai $essai échoué, nouvel essai dans 20 s…"; sleep 20
          done
          echo "La base ne répond pas : elle est peut-être en pause (bouton Restore dans Supabase)."
          exit 1
